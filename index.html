let currentRound = 1;
let scores = {};
let currentCandidates = [];
let previousCandidates = [];
let choosing = false;


/* =====================================================
   DOM
===================================================== */

  document.getElementById("gameArea");

  document.getElementById("resultArea");

  document.getElementById("playerGrid");

  document.getElementById("restartButton");


/* =====================================================
   ゲーム開始
===================================================== */

function initGame() {

  currentRound = 1;

  previousCandidates = [];

  choosing = false;

  scores = {};

  players.forEach(player => {
    scores[player.id] = 0;
  });

  totalRoundsElement.textContent =
    TOTAL_ROUNDS;

  gameArea.style.display = "block";

  resultArea.style.display = "none";

  showCandidates();
}


/* =====================================================
   4人を選ぶ
===================================================== */

function getCandidates() {

  let pool =
    shuffleArray(players);


  /*
   * 前回出た選手を少し避ける
   */

  if (previousCandidates.length > 0) {

    const preferred =
      pool.filter(player =>
        !previousCandidates.includes(player.id)
      );

    const avoided =
      pool.filter(player =>
        previousCandidates.includes(player.id)
      );


    /*
     * まず前回出ていない選手から選ぶ
     */

    const candidatePool =
      Math.random() < REPEAT_AVOIDANCE
        ? preferred
        : pool;


    /*
     * 4人に足りない場合は
     * 前回出た選手から補充
     */

    let selected =
      candidatePool.slice(
        0,
        CANDIDATE_COUNT
      );


    if (selected.length < CANDIDATE_COUNT) {

      selected = [
        ...selected,
        ...avoided.slice(
          0,
          CANDIDATE_COUNT - selected.length
        )
      ];

    }

    return selected;
  }


  return pool.slice(
    0,
    CANDIDATE_COUNT
  );
}


/* =====================================================
   選択肢表示
===================================================== */

function showCandidates() {

  choosing = false;

  playerGrid.innerHTML = "";

  currentCandidates =
    getCandidates();


  previousCandidates =
    currentCandidates.map(
      player => player.id
    );


  currentCandidates.forEach(player => {

    const card =
      document.createElement("button");

    card.type = "button";

    card.className =
      "player-card";


    card.innerHTML = `

      <img
        src="${player.image}"
        alt="${escapeHtml(player.name)}"
        onerror="this.src='https://placehold.co/800x800?text=${encodeURIComponent(player.name)}'"
      >

      <div class="choice-mark">
        ✓
      </div>

      <div class="player-info">

        <span class="player-name">
          ${escapeHtml(player.name)}
        </span>

        <span class="player-club">
          ${escapeHtml(player.club)}
        </span>

      </div>
    `;


    card.addEventListener(
      "click",
      () => choosePlayer(player, card)
    );


    playerGrid.appendChild(card);

  });


  currentRoundElement.textContent =
    currentRound;


  const percentage =
    ((currentRound - 1) / TOTAL_ROUNDS) * 100;


  progressInner.style.width =
    percentage + "%";
}


/* =====================================================
   選手を選択
===================================================== */

function choosePlayer(player, card) {

  if (choosing) {
    return;
  }

  choosing = true;


  /*
   * 得票 +1
   */

  scores[player.id]++;


  card.classList.add("selected");


  setTimeout(() => {

    if (currentRound >= TOTAL_ROUNDS) {

      showResult();

      return;
    }


    currentRound++;

    showCandidates();

  }, 280);
}


/* =====================================================
   結果
===================================================== */

function showResult() {

  gameArea.style.display = "none";

  resultArea.style.display = "block";


  /*
   * 得票数の高い順
   *
   * 同点の場合はランダム
   */

  const ranking =
    [...players].sort((a,b) => {

      const difference =
        scores[b.id] - scores[a.id];

      if (difference !== 0) {
        return difference;
      }

      return Math.random() - .5;
    });


  /*
   * TOP9
   */

  const top9 =
    ranking.slice(
      0,
      RESULT_COUNT
    );


  /*
   * 3×3生成
   */

  resultGrid.innerHTML = "";


  top9.forEach((player,index) => {

    const cell =
      document.createElement("div");

    cell.className =
      "result-cell";


    cell.innerHTML = `

      <img
        src="${player.image}"
        alt="${escapeHtml(player.name)}"
        onerror="this.src='https://placehold.co/800x800?text=${encodeURIComponent(player.name)}'"
      >

      <div class="result-cell-name">

        ${index + 1}位
        ${escapeHtml(player.name)}
        ・${scores[player.id]}票

      </div>

    `;


    resultGrid.appendChild(cell);

  });


  /*
   * 全ランキング
   */

  rankingList.innerHTML = "";


  ranking.forEach((player,index) => {

    const row =
      document.createElement("div");

    row.className =
      "ranking-row";


    row.innerHTML = `

      <div class="rank">
        ${index + 1}
      </div>

      <div class="rank-photo">

        <img
          src="${player.image}"
          alt="${escapeHtml(player.name)}"
          onerror="this.src='https://placehold.co/100x100?text=${encodeURIComponent(player.name)}'"
        >

      </div>

      <div class="rank-name">
        ${escapeHtml(player.name)}
      </div>

      <div class="rank-score">
        ${scores[player.id]}票
      </div>

    `;


    rankingList.appendChild(row);

  });


  progressInner.style.width = "100%";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* =====================================================
   シャッフル
===================================================== */

function shuffleArray(array) {

  const result =
    [...array];


  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }


  return result;
}


/* =====================================================
   HTMLエスケープ
===================================================== */

function escapeHtml(text) {

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================================
   START
===================================================== */

initGame();
