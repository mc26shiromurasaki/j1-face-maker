<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J1好き顔9選メーカー</title>
    <!-- 画像ダウンロードを正常に動作させるためのライブラリ -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        h1 { color: #111; font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        #game-container, #result-container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* 4人表示用の2×2グリッド */
        .grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .player-card { background: #f8f9fa; border: 2px solid #eee; border-radius: 8px; padding: 20px 10px; cursor: pointer; transition: all 0.2s; min-height: 110px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .player-card:hover { border-color: #007bff; background: #e9ecef; transform: translateY(-2px); }
        .player-icon { width: 45px; height: 45px; background: #28a745; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 8px; }
        .player-name { font-weight: bold; font-size: 15px; color: #111; word-break: break-all; }
        .player-club { font-size: 12px; color: #666; margin-top: 4px; }
        
        /* ダウンロードされる3×3の画像エリア */
        #download-area { width: 320px; background: #111; padding: 20px 15px 15px 15px; margin: 20px auto; text-align: center; box-sizing: border-box; }
        .grid-title { color: #fff; font-size: 16px; font-weight: bold; margin-bottom: 15px; letter-spacing: 2px; font-family: 'Arial Black', sans-serif; }
        .grid-3x3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #111; height: 290px; }
        .result-item { background: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; text-align: center; padding: 4px; overflow: hidden; border-radius: 4px; color: #111; }
        .result-club { font-size: 9px; color: #666; font-weight: normal; margin-top: 3px; }
        
        /* ボタン装飾 */
        .btn { border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 10px 5px; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .hidden { display: none; }
        #progress { font-size: 15px; color: #444; font-weight: bold; background: #e9ecef; padding: 8px; border-radius: 6px; }
    </style>
</head>
<body>

    <h1>⚽ J1好き顔9選メーカー ⚽</h1>
    <div class="subtitle">表示された4人の中から「一番好みの顔」をタップして9人選ぼう！</div>

    <!-- 選択ゲーム画面 -->
    <div id="game-container">
        <div id="progress">お気に入り獲得数: <span id="saved-count">0</span> / 9人</div>
        <div class="grid-4" id="match-grid">
            <!-- JavaScriptで4人のカードがここに入ります -->
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-container" class="hidden">
        <h2>✨ あなたのJ1好き顔9選 ✨</h2>
        
        <!-- ここが画像として切り出されます -->
        <div id="download-area">
            <div class="grid-title">MY J1 FAVORITE 9</div>
            <div class="grid-3x3" id="final-grid">
                <!-- 選ばれた9人がここに並びます -->
            </div>
        </div>
        
        <button class="btn btn-success" onclick="downloadImage()">画像を保存する</button>
        <button class="btn btn-primary" onclick="location.reload()">もう一度遊ぶ</button>
    </div>

    <script>
        // サンプル選手データ（J1の主要クラブから25名）
        const allPlayers = [
            { name: "大迫 勇也", club: "神戸" },
            { name: "武藤 嘉紀", club: "神戸" },
            { name: "山口 蛍", club: "神戸" },
            { name: "西川 周作", club: "浦和" },
            { name: "渡邊 凌磨", club: "浦和" },
            { name: "鈴木 優磨", club: "鹿島" },
            { name: "柴崎 岳", club: "鹿島" },
            { name: "脇坂 泰斗", club: "川崎" },
            { name: "家長 昭博", club: "川崎" },
            { name: "香川 真司", club: "C大阪" },
            { name: "毎熊 晟矢", club: "C大阪" },
            { name: "宇佐美 貴史", club: "G大阪" },
            { name: "ディエゴ オリヴェイラ", club: "FC東京" },
            { name: "長友 佑都", club: "FC東京" },
            { name: "荒木 遼太郎", club: "FC東京" },
            { name: "細谷 真大", club: "柏" },
            { name: "マテウス サヴィオ", club: "柏" },
            { name: "宮市 亮", club: "横浜FM" },
            { name: "喜田 拓也", club: "横浜FM" },
            { name: "満田 誠", club: "広島" },
            { name: "大迫 敬介", club: "広島" },
            { name: "浅野 雄也", club: "札幌" },
            { name: "鈴木 武蔵", club: "札幌" },
            { name: "植中 朝日", club: "横浜FM" },
            { name: "名古 新太郎", club: "鹿島" }
        ];

        let selectedWinners = [];

        // 配列をランダムに並び替える関数
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 4人の対戦ラウンドを開始する関数
        function startRound() {
            document.getElementById('saved-count').innerText = selectedWinners.length;

            // 9人選出できたら結果画面へ
            if (selectedWinners.length >= 9) {
                showResults();
                return;
            }

            const grid = document.getElementById('match-grid');
            grid.innerHTML = '';

            // まだ選ばれていない選手からランダムに4人選出
            let shuffled = shuffle([...allPlayers]);
            let currentMatch = [];
            
            for (let p of shuffled) {
                if (!selectedWinners.includes(p)) {
                    currentMatch.push(p);
                }
                if (currentMatch.length === 4) break;
            }

            // 万が一プールが足りない場合の補填処理
            while (currentMatch.length < 4) {
                let randomPlayer = allPlayers[Math.floor(Math.random() * allPlayers.length)];
                if (!currentMatch.includes(randomPlayer)) {
                    currentMatch.push(randomPlayer);
                }
            }

            // 画面にカードを生成
            currentMatch.forEach(player => {
                const card = document.createElement('div');
                card.className = 'player-card';
                card.onclick = () => selectPlayer(player);

                card.innerHTML = `
                    <div class="player-icon">⚽</div>
                    <div class="player-name">${player.name}</div>
                    <div class="player-club">${player.club}</div>
                `;
                grid.appendChild(card);
            });
        }

        // 選手がタップされた時の処理
        function selectPlayer(winner) {
            if (!selectedWinners.includes(winner)) {
                selectedWinners.push(winner);
            }
            startRound();
        }

        // 結果を3×3で表示する関数
        function showResults() {
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');

            const finalGrid = document.getElementById('final-grid');
            finalGrid.innerHTML = '';

            selectedWinners.slice(0, 9).forEach(player => {
                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = `
                    <div>${player.name}</div>
                    <div class="result-club">${player.club}</div>
                `;
                finalGrid.appendChild(item);
            });
        }

        // 表示されている3x3エリアを画像化してダウンロード
        function downloadImage() {
            const target = document.getElementById('download-area');
            // 高画質で出力するためにscaleを2に設定
            html2canvas(target, { scale: 2, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'j1_favorite_9.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // 初回起動
        startRound();
    </script>
</body>
</html>
