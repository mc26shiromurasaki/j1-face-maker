<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jリーグ好き顔9選メーカー</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        Meiryo,
        sans-serif;
      background: #f3f5f8;
      color: #222;
    }

    .container {
      width: min(900px, 94%);
      margin: 0 auto;
      padding: 30px 0 60px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 5vw, 38px);
      font-weight: 800;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin: 0;
    }

    /* --------------------
       選択画面
    -------------------- */

    .game-area {
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .progress {
      text-align: center;
      margin-bottom: 20px;
    }

    .progress-number {
      font-size: 30px;
      font-weight: 800;
    }

    .progress-text {
      color: #666;
      font-size: 14px;
    }

    .player-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .player-card {
      position: relative;
      border: 3px solid transparent;
      border-radius: 16px;
      overflow: hidden;
      background: #f7f7f7;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;
      padding: 0;
      font: inherit;
    }

    .player-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .player-card:active {
      transform: scale(0.98);
    }

    .player-card img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #ddd;
    }

    .player-name {
      display: block;
      padding: 12px 8px;
      background: #fff;
      font-size: 17px;
      font-weight: 700;
    }

    .player-club {
      display: block;
      padding: 0 8px 12px;
      background: #fff;
      color: #777;
      font-size: 12px;
    }

    .selected-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 36px;
      height: 36px;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #e60012;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
    }

    .player-card.selected {
      border-color: #e60012;
    }

    .player-card.selected .selected-badge {
      display: flex;
    }

    /* --------------------
       選択済み一覧
    -------------------- */

    .selected-section {
      margin-top: 28px;
    }

    .selected-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .selected-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .selected-item {
      width: 55px;
      height: 55px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #ddd;
    }

    .selected-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* --------------------
       結果画面
    -------------------- */

    #resultArea {
      display: none;
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .result-title {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 800;
    }

    .result-description {
      margin: 0 0 22px;
      color: #666;
      font-size: 14px;
    }

    .result-grid {
      width: min(650px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      background: #111;
      border: 3px solid #111;
    }

    .result-cell {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #ddd;
    }

    .result-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .result-cell-name {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 8px 4px;
      background: linear-gradient(
        transparent,
        rgba(0, 0, 0, 0.8)
      );
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-shadow: 0 1px 3px #000;
    }

    .result-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    button.action-button {
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    button.action-button:hover {
      transform: translateY(-2px);
    }

    .download-button {
      background: #111;
      color: #fff;
    }

    .restart-button {
      background: #eee;
      color: #222;
    }

    /* --------------------
       スマホ対応
    -------------------- */

    @media (max-width: 600px) {
      .container {
        padding-top: 20px;
      }

      .game-area,
      #resultArea {
        padding: 16px;
        border-radius: 16px;
      }

      .player-grid {
        gap: 10px;
      }

      .player-name {
        font-size: 14px;
        padding: 9px 5px;
      }

      .player-club {
        font-size: 10px;
        padding: 0 5px 9px;
      }

      .selected-item {
        width: 45px;
        height: 45px;
      }

      .result-cell-name {
        font-size: 10px;
        padding: 5px 2px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>⚽ Jリーグ好き顔9選</h1>
      <p class="subtitle">
        4人の中から「好き！」と思う選手を選んでください
      </p>
    </header>

    <!-- ==========================
         選択画面
    =========================== -->
    <section id="gameArea" class="game-area">

      <div class="progress">
        <div class="progress-number">
          <span id="selectedCount">0</span> / 9
        </div>

        <div class="progress-text">
          好きな顔を選択中
        </div>
      </div>

      <div id="playerGrid" class="player-grid">
        <!-- JavaScriptで選手を表示 -->
      </div>

      <div class="selected-section">
        <div class="selected-title">
          現在の9選
        </div>

        <div id="selectedList" class="selected-list">
          <!-- JavaScriptで表示 -->
        </div>
      </div>

    </section>


    <!-- ==========================
         結果画面
    =========================== -->
    <section id="resultArea">

      <h2 class="result-title">
        あなたの好き顔9選
      </h2>

      <p class="result-description">
        これがあなたのJリーグ好き顔9選！
      </p>

      <div id="resultGrid" class="result-grid">
        <!-- JavaScriptで生成 -->
      </div>

      <div class="result-buttons">

        <button
          id="downloadButton"
          class="action-button download-button">
          🖼️ 画像を保存
        </button>

        <button
          id="restartButton"
          class="action-button restart-button">
          🔄 もう一度遊ぶ
        </button>

      </div>

    </section>

  </div>


  <!-- html2canvas
       結果の3×3グリッドを画像化するために使用 -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
  </script>


  <script>

    /* ==================================================
       選手データ
       ==================================================

       ここに選手を追加していくだけでOKです。

       image は写真URLです。

       現在は「UI Avatars」というプレースホルダーを
       使用しています。

       実際の選手写真を使う場合は、GitHubリポジトリに
       画像を入れて、

       image: "images/endo.jpg"

       のように変更することをおすすめします。
    ================================================== */

    const players = [

      {
        id: 1,
        name: "遠藤 航",
        club: "浦和レッズなど",
        image:
          "https://ui-avatars.com/api/?name=%E9%81%A0%E8%97%A4%E8%88%AA&size=800&background=cc0000&color=ffffff&bold=true"
      },

      {
        id: 2,
        name: "谷口 彰悟",
        club: "川崎フロンターレなど",
        image:
          "https://ui-avatars.com/api/?name=%E8%B0%B7%E5%8F%A3%E5%BD%B0%E6%82%9F&size=800&background=0066cc&color=ffffff&bold=true"
      },

      {
        id: 3,
        name: "家長 昭博",
        club: "川崎フロンターレ",
        image:
          "https://ui-avatars.com/api/?name=%E5%AE%B6%E9%95%B7%E6%98%AD%E5%8D%9A&size=800&background=009944&color=ffffff&bold=true"
      },

      {
        id: 4,
        name: "大迫 勇也",
        club: "ヴィッセル神戸など",
        image:
          "https://ui-avatars.com/api/?name=%E5%A4%A7%E8%BF%AB%E5%8B%87%E4%B9%9F&size=800&background=990000&color=ffffff&bold=true"
      },

      {
        id: 5,
        name: "中村 憲剛",
        club: "川崎フロンターレ",
        image:
          "https://ui-avatars.com/api/?name=%E4%B8%AD%E6%9D%91%E6%86%B2%E5%89%9B&size=800&background=003399&color=ffffff&bold=true"
      }

    ];


    /* ==================================================
       設定
    ================================================== */

    const MAX_SELECTION = 9;
    const DISPLAY_COUNT = 4;


    /* ==================================================
       状態
    ================================================== */

    let selectedPlayers = [];
    let currentCandidates = [];


    /* ==================================================
       DOM
    ================================================== */

    const gameArea = document.getElementById("gameArea");
    const resultArea = document.getElementById("resultArea");

    const playerGrid = document.getElementById("playerGrid");

    const selectedCount =
      document.getElementById("selectedCount");

    const selectedList =
      document.getElementById("selectedList");

    const resultGrid =
      document.getElementById("resultGrid");

    const downloadButton =
      document.getElementById("downloadButton");

    const restartButton =
      document.getElementById("restartButton");


    /* ==================================================
       初期化
    ================================================== */

    function init() {

      selectedPlayers = [];

      gameArea.style.display = "block";
      resultArea.style.display = "none";

      updateSelectedList();

      showNextCandidates();
    }


    /* ==================================================
       ランダムな4人を表示
    ================================================== */

    function showNextCandidates() {

      playerGrid.innerHTML = "";

      /*
       * まだ選んでいない選手を優先する
       */
      let availablePlayers =
        players.filter(player =>
          !selectedPlayers.some(
            selected => selected.id === player.id
          )
        );


      /*
       * サンプル人数が9人未満でも動作するよう、
       * 選手が足りなくなった場合は全選手から補充します。
       *
       * 本番ではJ1選手を9人以上登録するのがおすすめです。
       */

      if (availablePlayers.length < DISPLAY_COUNT) {

        availablePlayers = [
          ...availablePlayers,
          ...players.filter(player =>
            !availablePlayers.some(
              p => p.id === player.id
            )
          )
        ];

      }


      currentCandidates =
        shuffleArray(availablePlayers)
          .slice(0, Math.min(
            DISPLAY_COUNT,
            availablePlayers.length
          ));


      currentCandidates.forEach(player => {

        const card =
          document.createElement("button");

        card.className = "player-card";

        card.type = "button";

        card.innerHTML = `

          <img
            src="${player.image}"
            alt="${escapeHtml(player.name)}"
            crossorigin="anonymous"
          >

          <span class="selected-badge">
            ✓
          </span>

          <span class="player-name">
            ${escapeHtml(player.name)}
          </span>

          <span class="player-club">
            ${escapeHtml(player.club)}
          </span>

        `;

        card.addEventListener(
          "click",
          () => selectPlayer(player, card)
        );

        playerGrid.appendChild(card);

      });

    }


    /* ==================================================
       選手を選択
    ================================================== */

    function selectPlayer(player, card) {

      /*
       * 9人に達したら何もしない
       */
      if (selectedPlayers.length >= MAX_SELECTION) {
        return;
      }


      /*
       * すでに選択済みなら何もしない
       */
      if (
        selectedPlayers.some(
          selected => selected.id === player.id
        )
      ) {

        return;

      }


      /*
       * 選択状態
       */
      card.classList.add("selected");


      /*
       * 選手を追加
       */
      selectedPlayers.push(player);


      updateSelectedList();


      /*
       * 9人選び終わった
       */
      if (
        selectedPlayers.length >= MAX_SELECTION
      ) {

        setTimeout(() => {
          showResult();
        }, 300);

        return;
      }


      /*
       * 少し待って次の4人を表示
       */
      setTimeout(() => {

        showNextCandidates();

      }, 250);

    }


    /* ==================================================
       選択済み一覧
    ================================================== */

    function updateSelectedList() {

      selectedCount.textContent =
        selectedPlayers.length;


      selectedList.innerHTML = "";


      selectedPlayers.forEach(player => {

        const item =
          document.createElement("div");

        item.className = "selected-item";

        item.title = player.name;

        item.innerHTML = `

          <img
            src="${player.image}"
            alt="${escapeHtml(player.name)}"
            crossorigin="anonymous"
          >

        `;

        selectedList.appendChild(item);

      });

    }


    /* ==================================================
       結果を表示
    ================================================== */

    function showResult() {

      gameArea.style.display = "none";

      resultArea.style.display = "block";

      resultGrid.innerHTML = "";


      selectedPlayers.forEach(
        (player, index) => {

          const cell =
            document.createElement("div");

          cell.className = "result-cell";

          cell.innerHTML = `

            <img
              src="${player.image}"
              alt="${escapeHtml(player.name)}"
              crossorigin="anonymous"
            >

            <div class="result-cell-name">
              ${index + 1}. ${escapeHtml(player.name)}
            </div>

          `;

          resultGrid.appendChild(cell);

        }
      );


      /*
       * ページ上部へスクロール
       */
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* ==================================================
       画像として保存
    ================================================== */

    downloadButton.addEventListener(
      "click",
      async function() {

        downloadButton.disabled = true;

        downloadButton.textContent =
          "画像を作成中...";


        try {

          /*
           * 結果グリッドをCanvas化
           */
          const canvas =
            await html2canvas(
              resultGrid,
              {
                backgroundColor: "#111",
                scale: 2,
                useCORS: true
              }
            );


          /*
           * PNGとして保存
           */
          const link =
            document.createElement("a");

          link.download =
            "jleague-sukigao9.png";

          link.href =
            canvas.toDataURL("image/png");


          link.click();

        } catch (error) {

          console.error(error);

          alert(
            "画像の保存に失敗しました。"
            + "\n写真URLのCORS設定などを確認してください。"
          );

        }


        downloadButton.disabled = false;

        downloadButton.textContent =
          "🖼️ 画像を保存";

      }
    );


    /* ==================================================
       もう一度遊ぶ
    ================================================== */

    restartButton.addEventListener(
      "click",
      function() {

        init();

      }
    );


    /* ==================================================
       配列をシャッフル
    ================================================== */

    function shuffleArray(array) {

      const result =
        [...array];


      for (
        let i = result.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );


        [
          result[i],
          result[j]
        ] = [
          result[j],
          result[i]
        ];

      }


      return result;

    }


    /* ==================================================
       HTMLエスケープ
    ================================================== */

    function escapeHtml(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* ==================================================
       START
    ================================================== */

    init();

  </script>

</body>
</html>
