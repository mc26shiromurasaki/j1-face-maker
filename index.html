        let selectedWinners = [];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startRound() {
            document.getElementById('saved-count').innerText = selectedWinners.length;

            // 9人選ばれたら終了
            if (selectedWinners.length >= 9) {
                showResults();
                return;
            }

            const grid = document.getElementById('match-grid');
            grid.innerHTML = '';

            // 全選手からランダムに4人を抽出（重複なし）
            let shuffled = shuffle([...allPlayers]);
            // すでに選ばれている選手は除外して4人選ぶ
            let currentMatch = [];
            for (let p of shuffled) {
                if (!selectedWinners.includes(p)) {
                    currentMatch.push(p);
                }
                if (currentMatch.length === 4) break;
            }

            // 万が一、残りの選手が4人に満たない場合は選ばれた人からも補填
            while (currentMatch.length < 4) {
                let randomPlayer = allPlayers[Math.floor(Math.random() * allPlayers.length)];
                if (!currentMatch.includes(randomPlayer)) {
                    currentMatch.push(randomPlayer);
                }
            }

            currentMatch.forEach(player => {
                const card = document.createElement('div');
                card.className = 'player-card';
                card.onclick = () => selectPlayer(player);

                card.innerHTML = `
                    <div class="player-img-placeholder">⚽</div>
                    <div class="player-name">${player.name}</div>
                    <div class="player-club">${player.club}</div>
                `;
                grid.appendChild(card);
            });
        }

        function selectPlayer(winner) {
            // 選んだ選手を9選リストに追加
            if (!selectedWinners.includes(winner)) {
                selectedWinners.push(winner);
            }
            startRound();
        }

        function showResults() {
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('result-container').classList.remove('hidden');

            const finalGrid = document.getElementById('final-grid');
            finalGrid.innerHTML = '';

            selectedWinners.slice(0, 9).forEach(player => {
                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = `
                    <div>${player.name}</div>
                    <div class="result-club">${player.club}</div>
                `;
                finalGrid.appendChild(item);
            });
        }

        // 画像としてダウンロードする機能
        function downloadImage() {
            const target = document.getElementById('download-area');
            html2canvas(target, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'j1_sukigao_9.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // ゲーム開始
        startRound();
